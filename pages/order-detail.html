<!doctype html>
<html lang="id" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var t = localStorage.getItem("sa-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", t);
      } catch (e) {}
    </script>
    <title>Detail pesanan · Simple Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <!-- ============ SIDEBAR: isinya dirender shell.js dari assets/js/nav.js ============ -->
    <aside class="sa-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="saSidebar" aria-labelledby="saSidebarLabel"></aside>

    <!-- ============ MAIN ============ -->
    <div class="sa-main">
      <!-- Topbar: isinya dirender shell.js dari assets/js/nav.js -->
      <header class="sa-topbar" id="saTopbar"></header>

      <main class="sa-content container-fluid px-3 px-lg-4">
        <div class="sa-page">
          <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4 sa-no-print">
            <div>
              <div class="sa-crumb mb-1"><a href="orders.html" class="text-reset text-decoration-none">Pesanan</a> / Detail</div>
              <h1 class="sa-page-title" id="saInvTitle">Detail pesanan</h1>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <a class="btn btn-light btn-sm d-inline-flex align-items-center gap-1" href="orders.html"><i class="bi bi-arrow-left" aria-hidden="true"></i>Kembali</a>
              <button class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1" type="button" id="saPrint"><i class="bi bi-printer" aria-hidden="true"></i>Cetak invoice</button>
            </div>
          </div>

          <div class="row g-4" id="saInvBody">
            <div class="col-xl-8 sa-print-full">
              <section class="sa-panel sa-invoice" id="saInvoice" aria-label="Invoice"></section>
            </div>
            <div class="col-xl-4 sa-no-print">
              <section class="sa-panel mb-4">
                <div class="sa-panel-head"><h2>Status pesanan</h2><span id="saInvStatus"></span></div>
                <ul class="sa-activity" id="saInvTimeline"></ul>
                <div class="px-4 pb-4 d-grid gap-2" id="saInvActions"></div>
              </section>
              <section class="sa-panel">
                <div class="sa-panel-head"><h2>Pelanggan</h2></div>
                <div class="p-3 px-4" id="saInvCustomer"></div>
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/pages/order-detail.js"></script>
  </body>
</html>
