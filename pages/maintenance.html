<!doctype html>
<html lang="id" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <script>
      try {
        var t = localStorage.getItem("sa-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", t);
      } catch (e) {}
    </script>
    <title>Sedang Dalam Perawatan · Simple Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <button class="btn btn-light sa-icon-btn sa-theme-toggle sa-auth-theme" type="button" id="saThemeToggle" aria-label="Aktifkan mode gelap" aria-pressed="false">
      <i class="bi bi-sun sa-icon-sun" aria-hidden="true"></i>
      <i class="bi bi-moon sa-icon-moon" aria-hidden="true"></i>
    </button>

    <main class="sa-error">
      <div class="sa-error-card">
        <a href="../index.html" class="sa-brand justify-content-center mb-4">
          <span class="sa-brand-mark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
          </span>
          simple-admin
        </a>

        <div class="sa-error-code" aria-hidden="true">
          <span class="sa-error-zero sa-error-icon"><i class="bi bi-tools" aria-hidden="true"></i></span>
        </div>

        <h1 class="sa-error-title">Sedang dalam perawatan</h1>
        <p class="sa-error-text">Kami sedang meningkatkan sistem agar lebih cepat dan stabil. Dashboard akan kembali tersedia sekitar pukul <strong>22.00 WIB</strong>.</p>

        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
          <button type="button" class="btn btn-primary" data-reload>Muat ulang</button>
          <a href="mailto:halo@tokosatria.id" class="btn btn-light">Hubungi dukungan</a>
        </div>

        <nav class="sa-error-links" aria-label="Info lain">
          <span>Pantau status:</span>
          <a href="#" data-toast="Halaman status dibuka">status.tokosatria.id</a>
        </nav>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/pages/error.js"></script>
  </body>
</html>
