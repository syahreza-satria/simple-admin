<!doctype html>
<html lang="id" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var t = localStorage.getItem("sa-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", t);
      } catch (e) {}
    </script>
    <title>Pesanan · Simple Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <!-- ============ SIDEBAR: isinya dirender shell.js dari assets/js/nav.js ============ -->
    <aside class="sa-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="saSidebar" aria-labelledby="saSidebarLabel"></aside>

    <!-- ============ MAIN ============ -->
    <div class="sa-main">
      <!-- Topbar: isinya dirender shell.js dari assets/js/nav.js -->
      <header class="sa-topbar" id="saTopbar"></header>

      <main class="sa-content container-fluid px-3 px-lg-4">
                <div class="sa-page">
          <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
            <div>
              <div class="sa-crumb mb-1">Beranda / Pesanan</div>
              <h1 class="sa-page-title">Pesanan</h1>
            </div>
            <div class="d-flex gap-2 flex-wrap"><button class="btn btn-light btn-sm d-inline-flex align-items-center gap-1" type="button" id="saOrdExport"><i class="bi bi-download" aria-hidden="true"></i>Ekspor CSV</button></div>
          </div>

          <section class="sa-panel">
            <div class="sa-panel-head">
              <ul class="nav nav-pills small" id="saOrdFilter">
                <li class="nav-item"><button class="nav-link active py-1 px-2" data-filter="all" type="button">Semua</button></li>
                <li class="nav-item"><button class="nav-link py-1 px-2" data-filter="pending" type="button">Menunggu</button></li>
                <li class="nav-item"><button class="nav-link py-1 px-2" data-filter="process" type="button">Diproses</button></li>
                <li class="nav-item"><button class="nav-link py-1 px-2" data-filter="paid" type="button">Lunas</button></li>
                <li class="nav-item"><button class="nav-link py-1 px-2" data-filter="failed" type="button">Gagal</button></li>
              </ul>
              <input type="search" class="form-control form-control-sm" id="saOrdSearch" placeholder="Cari pesanan atau pelanggan…" aria-label="Cari pesanan atau pelanggan…" style="width: 220px; max-width: 100%" />
            </div>
            <div id="saOrdersTable"></div>
          </section>
        </div>

      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/datatable.js"></script>
    <script src="../assets/js/pages/orders.js"></script>
  </body>
</html>
