<!doctype html>
<html lang="id" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var t = localStorage.getItem("sa-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", t);
      } catch (e) {}
    </script>
    <title>Halaman kosong · Simple Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <!-- ============ SIDEBAR: isinya dirender shell.js dari assets/js/nav.js ============ -->
    <aside class="sa-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="saSidebar" aria-labelledby="saSidebarLabel"></aside>

    <!-- ============ MAIN ============ -->
    <div class="sa-main">
      <!-- Topbar: isinya dirender shell.js dari assets/js/nav.js -->
      <header class="sa-topbar" id="saTopbar"></header>

      <main class="sa-content container-fluid px-3 px-lg-4">
        <div class="sa-page">
          <!-- Halaman kosong: salin file ini untuk membuat halaman baru.
               1. Ganti <title>, breadcrumb, dan judul.
               2. Daftarkan halaman di assets/js/nav.js.
               3. Isi bagian di bawah dengan panel (.sa-panel). -->
          <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
            <div>
              <div class="sa-crumb mb-1">Beranda / Halaman kosong</div>
              <h1 class="sa-page-title">Halaman kosong</h1>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-primary btn-sm" data-toast="Aksi utama dijalankan">Aksi utama</button>
            </div>
          </div>

          <section class="sa-panel">
            <div class="sa-panel-head"><h2>Judul panel</h2></div>
            <div class="p-3 px-4">
              <p class="mb-0 text-body-secondary">Mulai membangun di sini. Lihat <a href="docs/getting-started.html">panduan Memulai</a> untuk langkah menambah halaman dan menu.</p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script src="../assets/js/shell.js"></script>
  </body>
</html>
