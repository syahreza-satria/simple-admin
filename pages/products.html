<!doctype html>
<html lang="id" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var t = localStorage.getItem("sa-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", t);
      } catch (e) {}
    </script>
    <title>Produk · Simple Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <!-- ============ SIDEBAR: isinya dirender shell.js dari assets/js/nav.js ============ -->
    <aside class="sa-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="saSidebar" aria-labelledby="saSidebarLabel"></aside>

    <!-- ============ MAIN ============ -->
    <div class="sa-main">
      <!-- Topbar: isinya dirender shell.js dari assets/js/nav.js -->
      <header class="sa-topbar" id="saTopbar"></header>

      <main class="sa-content container-fluid px-3 px-lg-4">
                <div class="sa-page">
          <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
            <div>
              <div class="sa-crumb mb-1">Beranda / Produk</div>
              <h1 class="sa-page-title">Produk</h1>
            </div>
            <div class="d-flex gap-2 flex-wrap"><button class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1" type="button" data-bs-toggle="modal" data-bs-target="#saModal"><i class="bi bi-plus-lg" aria-hidden="true"></i>Tambah Produk</button></div>
          </div>

          <section class="sa-panel">
            <div class="sa-panel-head">
              <div class="d-flex gap-2 flex-wrap">
                <input type="search" class="form-control form-control-sm" id="saProdSearch" placeholder="Cari produk…" aria-label="Cari produk…" style="width: 220px; max-width: 100%" />
                <select class="form-select form-select-sm" id="saProdCat" aria-label="Kategori" style="width: auto"><option value="all">Semua kategori</option><option>Pakaian</option><option>Aksesoris</option><option>Tas</option></select>
              </div>
              <small class="text-body-secondary sa-num" id="saProdCount"></small>
            </div>
            <div class="table-responsive"><table class="table sa-table"><thead><tr><th>Produk</th><th>Kategori</th><th class="text-end">Harga</th><th class="text-end">Stok</th><th>Status</th></tr></thead><tbody id="saProducts"></tbody></table></div>
          </section>
        </div>

      </main>
    </div>

    <!-- Modal: Tambah Produk -->
    <div class="modal fade sa-modal" id="saModal" tabindex="-1" aria-labelledby="saModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="saProductForm">
          <div class="modal-header">
            <h5 class="modal-title" id="saModalLabel">Tambah produk</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
          </div>
          <div class="modal-body d-grid gap-3">
            <div><label for="pName" class="form-label small fw-medium">Nama produk</label><input id="pName" class="form-control" value="Kaos Oversize Navy" required /></div>
            <div class="row g-3">
              <div class="col-6"><label for="pPrice" class="form-label small fw-medium">Harga (Rp)</label><input id="pPrice" type="number" class="form-control" value="129000" min="0" required /></div>
              <div class="col-6"><label for="pStock" class="form-label small fw-medium">Stok</label><input id="pStock" type="number" class="form-control" value="40" min="0" required /></div>
            </div>
            <div>
              <label for="pCat" class="form-label small fw-medium">Kategori</label>
              <select id="pCat" class="form-select">
                <option>Pakaian</option>
                <option>Aksesoris</option>
                <option>Tas</option>
              </select>
            </div>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="pActive" checked /><label class="form-check-label small" for="pActive">Tampilkan di toko</label></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-primary">Simpan produk</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/pages/products.js"></script>
  </body>
</html>
