<!doctype html>
<html lang="id" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var t = localStorage.getItem("sa-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", t);
      } catch (e) {}
    </script>
    <title>Pengaturan · Simple Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <!-- ============ SIDEBAR: isinya dirender shell.js dari assets/js/nav.js ============ -->
    <aside class="sa-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="saSidebar" aria-labelledby="saSidebarLabel"></aside>

    <!-- ============ MAIN ============ -->
    <div class="sa-main">
      <!-- Topbar: isinya dirender shell.js dari assets/js/nav.js -->
      <header class="sa-topbar" id="saTopbar"></header>

      <main class="sa-content container-fluid px-3 px-lg-4">
                <div class="sa-page">
          <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
            <div>
              <div class="sa-crumb mb-1">Beranda / Pengaturan</div>
              <h1 class="sa-page-title">Pengaturan</h1>
            </div>
            <div class="d-flex gap-2 flex-wrap"></div>
          </div>

          <div class="row g-4">
            <div class="col-xl-8">
              <form class="sa-panel mb-4" data-toast-form="Pengaturan toko disimpan">
                <div class="sa-panel-head"><h2>Profil toko</h2></div>
                <div class="p-4"><div class="row g-3">
                  <div class="col-12"><label for="sName" class="form-label small fw-medium">Nama toko</label><input id="sName" type="text" class="form-control" value="Toko Satria" /></div>
                  <div class="col-md-6"><label for="sEmail" class="form-label small fw-medium">Email</label><input id="sEmail" type="email" class="form-control" value="halo@tokosatria.id" /></div>
                  <div class="col-md-6"><label for="sPhone" class="form-label small fw-medium">Telepon</label><input id="sPhone" type="tel" class="form-control" value="0812-3456-7890" /></div>
                  <div class="col-12"><label for="sAddr" class="form-label small fw-medium">Alamat</label><textarea id="sAddr" class="form-control" rows="3">Jl. Merdeka No. 12, Bandung</textarea></div>
                </div></div>
                <div class="px-4 py-3 border-top text-end" style="border-color: var(--sa-line) !important"><button type="submit" class="btn btn-primary btn-sm">Simpan perubahan</button></div>
              </form>
              <form class="sa-panel" data-toast-form="Preferensi disimpan">
                <div class="sa-panel-head"><h2>Preferensi</h2></div>
                <div class="p-4"><div class="row g-3">
                  <div class="col-md-4"><label for="sLang" class="form-label small fw-medium">Bahasa</label><select id="sLang" class="form-select"><option>Indonesia</option><option>English</option></select></div>
                  <div class="col-md-4"><label for="sTz" class="form-label small fw-medium">Zona waktu</label><select id="sTz" class="form-select"><option>WIB (UTC+7)</option><option>WITA (UTC+8)</option><option>WIT (UTC+9)</option></select></div>
                  <div class="col-md-4"><label for="sCur" class="form-label small fw-medium">Mata uang</label><select id="sCur" class="form-select"><option>Rupiah (Rp)</option><option>US Dollar ($)</option></select></div>
                </div></div>
                <div class="px-4 py-3 border-top text-end" style="border-color: var(--sa-line) !important"><button type="submit" class="btn btn-primary btn-sm">Simpan perubahan</button></div>
              </form>
            </div>
            <div class="col-xl-4">
              <form class="sa-panel" data-toast-form="Preferensi notifikasi disimpan">
                <div class="sa-panel-head"><h2>Notifikasi</h2></div>
                <div class="p-4">
                  <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" role="switch" id="nOrder" checked /><label class="form-check-label" for="nOrder">Pesanan baru</label></div><div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" role="switch" id="nPay" checked /><label class="form-check-label" for="nPay">Pembayaran diterima</label></div><div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" role="switch" id="nStock" checked /><label class="form-check-label" for="nStock">Stok hampir habis</label></div><div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" role="switch" id="nNews" /><label class="form-check-label" for="nNews">Berita &amp; pembaruan produk</label></div>
                  <button type="submit" class="btn btn-primary btn-sm">Simpan</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/nav.js"></script>
    <script src="../assets/js/shell.js"></script>
  </body>
</html>
